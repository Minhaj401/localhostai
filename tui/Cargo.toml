[package]
name = "privatelm-tui"
version = "0.1.0"
edition = "2021"
description = "PrivateLM-LAN terminal client — chat on your laptop's compute"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"

[profile.release]
opt-level = 2
