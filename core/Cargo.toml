[package]
name = "privateml-core"
description = "Embedded LAN node for PrivateLM: OpenAI-compatible API, discovery, engine management"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest.workspace = true
tracing.workspace = true
toml = "0.8"
# QR generation: a hand-rolled encoder looked right but did not scan. Use a
# maintained implementation instead of reinventing Reed-Solomon.
qrcode = { version = "0.14", default-features = false }
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
percent-encoding = "2"
fs2 = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
