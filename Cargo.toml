[workspace]
members = ["core", "tui"]
resolver = "2"

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/Minhaj401/localhostai"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process", "signal"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
