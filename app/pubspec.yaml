name: privatelm_lan
description: localhost.ai — Run AI Locally. Private chat and LAN inference.
publish_to: "none"
version: 0.2.2+7

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  mobile_scanner: ^6.0.11
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lucide_icons: ^0.257.0
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/Outfit-OFL.txt
    - assets/logo/mark.svg
    - assets/logo/mark.png
    - assets/logo/lockup.png
    - assets/logo/provenance.json
    - assets/fonts/Outfit-Regular.ttf
    - assets/fonts/Outfit-Medium.ttf
    - assets/fonts/Outfit-SemiBold.ttf
    - assets/fonts/Outfit-Bold.ttf
    - assets/fonts/JetBrainsMono-Regular.ttf
    - assets/fonts/JetBrainsMono-Medium.ttf
    - assets/fonts/JetBrainsMono-Bold.ttf
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo/icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/logo/icon_foreground.png
  min_sdk_android: 24
  web:
    generate: true
    image_path: assets/logo/icon.png
    background_color: "#000000"
    theme_color: "#000000"

flutter_native_splash:
  color: "#000000"
  image: assets/logo/splash.png
  android: true
  ios: false
  web: true
  android_12:
    color: "#000000"
    image: assets/logo/icon.png
    icon_background_color: "#000000"
